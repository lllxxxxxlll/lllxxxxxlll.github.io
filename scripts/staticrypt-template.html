<!DOCTYPE html>
<html class="staticrypt-html">
<head>
    <meta charset="utf-8" />
    <title>/*[|template_title|]*/0</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="pragma" content="no-cache" />
    <style>
        :root { --accent: #0b6e6e; --accent-deep: #0c4a4a; --accent2: #c07f1a; }
        * { box-sizing: border-box; }
        .staticrypt-html { height: 100%; }
        .staticrypt-body {
            margin: 0; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(160deg, #f3f8f7 0%, #faf6ef 55%, #f2f6fb 100%);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
            color: #2f2f2f;
        }
        .lock-card {
            background: #fff; border-radius: 10px;
            box-shadow: 0 1px 2px rgba(15,40,40,.04), 0 12px 32px rgba(15,40,40,.08);
            padding: 40px 36px; width: 340px; max-width: calc(100vw - 48px);
            text-align: center;
        }
        .lock-icon { font-size: 30px; }
        .lock-title { margin: 12px 0 4px; font-size: 22px; letter-spacing: 1px; color: var(--accent-deep); }
        .lock-hint { margin: 0 0 20px; font-size: 13px; color: #8a8a8a; }
        .lock-input {
            width: 100%; padding: 12px 14px; font-size: 15px;
            border: 1px solid #e3ded3; border-radius: 6px; outline: none;
            background: #faf9f6;
        }
        .lock-input:focus { border-color: var(--accent); background: #fff; }
        .lock-btn {
            width: 100%; margin-top: 12px; padding: 12px;
            border: 0; border-radius: 6px; cursor: pointer;
            background: var(--accent); color: #fff; font-size: 15px; letter-spacing: 2px;
        }
        .lock-btn:hover { background: var(--accent-deep); }
        .hidden { display: none !important; }
        .spinner {
            width: 28px; height: 28px; border: 3px solid #d9eceb;
            border-right-color: var(--accent); border-radius: 50%;
            animation: spin .8s linear infinite; margin: 0 auto;
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="staticrypt-body">
    <div id="staticrypt_loading"><div class="spinner"></div></div>

    <div id="staticrypt_content" class="hidden">
        <div class="lock-card">
            <div class="lock-icon">🔒</div>
            <div class="lock-title">/*[|template_title|]*/0</div>
            <p class="lock-hint">/*[|template_instructions|]*/0</p>
            <form id="staticrypt-form" action="#" method="post">
                <input id="staticrypt-password" class="lock-input" type="password"
                    name="password" placeholder="/*[|template_placeholder|]*/0" autofocus />
                <button type="submit" class="lock-btn">/*[|template_button|]*/0</button>
            </form>
        </div>
    </div>

    <script>
        const staticryptInitiator = /*[|js_staticrypt|]*/0;
        const templateError = "/*[|template_error|]*/0";
        const staticryptConfig = /*[|staticrypt_config|]*/0;
        const templateConfig = {
            rememberExpirationKey: "staticrypt_expiration",
            rememberPassphraseKey: "staticrypt_passphrase",
            replaceHtmlCallback: null,
            clearLocalStorageCallback: null,
        };
        const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

        window.onload = async function () {
            const { isSuccessful } = await staticrypt.handleDecryptOnLoad();
            if (!isSuccessful) {
                document.getElementById("staticrypt_loading").classList.add("hidden");
                document.getElementById("staticrypt_content").classList.remove("hidden");
                document.getElementById("staticrypt-password").focus();
            }
        };

        document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
            e.preventDefault();
            const password = document.getElementById("staticrypt-password").value;
            const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, false);
            if (!isSuccessful) {
                alert(templateError);
            }
        });
    </script>
</body>
</html>
