<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="{{ .Site.Home.RelPermalink }}" aria-label="Gfit 首页"><span class="brand-mark">G<span>.</span></span><span class="brand-name">Gfit<small>Go For it</small></span></a>
    <nav class="main-nav" aria-label="主导航">
      <a href="{{ .Site.Home.RelPermalink }}" {{ if .IsHome }}aria-current="page"{{ end }}>首页</a>
      <a href="{{ "/posts/" | relURL }}" {{ if eq .Section "posts" }}aria-current="page"{{ end }}>文章</a>
      <a href="{{ "/categories/" | relURL }}">专题</a>
      <a href="{{ "/projects/" | relURL }}" {{ if eq .Section "projects" }}aria-current="page"{{ end }}>项目</a>
      <a href="{{ "/about/" | relURL }}" {{ if eq .Section "about" }}aria-current="page"{{ end }}>关于</a>
    </nav>
    <a class="header-github" href="{{ .Site.Params.github }}" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
  </div>
</header>
