<article class="post-card">
  <div class="post-card-meta"><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006.01.02" }}</time>{{ range first 1 .Params.categories }}<span>{{ . }}</span>{{ end }}</div>
  <div class="post-card-main"><h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3><p>{{ with .Params.summary }}{{ . }}{{ else }}{{ .Summary | plainify | truncate 150 }}{{ end }}</p></div>
  <a class="post-card-arrow" href="{{ .RelPermalink }}" aria-label="阅读 {{ .Title }}">↗</a>
</article>
