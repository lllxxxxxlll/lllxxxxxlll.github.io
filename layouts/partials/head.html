<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7f6f2">
<title>{{ if .IsHome }}Gfit · Go For it{{ else }}{{ .Title }} · Gfit{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ with .Params.summary }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}{{ end }}">
<link rel="canonical" href="{{ .Permalink }}">
{{ $style := resources.Get "css/style.css" | minify | fingerprint "sha256" }}
<link rel="stylesheet" href="{{ $style.RelPermalink }}" integrity="{{ $style.Data.Integrity }}" crossorigin="anonymous">
{{ with .OutputFormats.Get "RSS" }}<link rel="alternate" type="application/rss+xml" title="Gfit RSS" href="{{ .RelPermalink }}">{{ end }}
