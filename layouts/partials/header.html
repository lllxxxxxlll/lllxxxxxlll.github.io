<header class="site-header">
  <div class="container header-inner">
    <a class="site-title" href="{{ .Site.Home.RelPermalink }}">{{ .Site.Title }}</a>
    <nav class="site-nav">
      <a href="{{ .Site.Home.RelPermalink }}" {{ if .IsHome }}class="active"{{ end }}>首页</a>
      <a href="{{ "/posts/" | relURL }}" {{ if eq .Section "posts" }}class="active"{{ end }}>文章</a>
      <a href="{{ "/projects/" | relURL }}" {{ if eq .Section "projects" }}class="active"{{ end }}>项目</a>
      <a href="{{ "/about/" | relURL }}" {{ if eq .Section "about" }}class="active"{{ end }}>关于</a>
    </nav>
  </div>
</header>
