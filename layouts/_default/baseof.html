<!DOCTYPE html>
<html lang="zh-CN">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  <!-- 动态背景层：深色蒙版 + 粒子 canvas -->
  <div class="bg-overlay" aria-hidden="true"></div>
  <canvas id="particles" aria-hidden="true"></canvas>

  <div class="layout">
    {{ partial "sidebar.html" . }}
    <div class="content-area">
      <main class="container">
        {{ block "main" . }}{{ end }}
      </main>
      {{ partial "footer.html" . }}
    </div>
  </div>

  <script src="{{ "js/bubbles.js" | relURL }}" defer></script>
</body>
</html>
